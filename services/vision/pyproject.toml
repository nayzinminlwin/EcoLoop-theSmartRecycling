[project]
name = "ecoloop-vision"
version = "0.1.0"
description = "EcoLoop hosted vision-provider smoke probe"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.0,<1",
  "google-genai>=1.41.0,<2",
  "inference-sdk>=0.9.0,<1",
  "pillow>=11.3.0,<12",
  "pydantic>=2.11.0,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
ecoloop-vision-probe = "ecoloop_vision.tools.probe_models:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoloop_vision"]
