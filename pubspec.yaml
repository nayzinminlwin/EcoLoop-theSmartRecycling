name: eco_loop
description: "EcoLoop AI resident recycling application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  firebase_app_check: ^0.5.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  firebase_storage: ^14.0.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.1
  go_router: ^16.2.4
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  integration_test:
    sdk: flutter
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icon/ecoLoop_icon_transparent.png
    - assets/mock/metadata.json
    - assets/mock/account/
    - assets/mock/wallet/
    - assets/mock/activity/
    - assets/mock/recycling_guide/
    - assets/mock/scan/
    - assets/mock/rewards/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
