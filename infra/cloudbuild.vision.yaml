steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/vision/Dockerfile
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/$PROJECT_ID/ecoloop/vision:${SHORT_SHA}
